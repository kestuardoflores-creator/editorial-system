name: Build Windows Portable

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v1.0)'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r app/assembler/requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: pyinstaller EditorialSystem.spec --noconfirm

      - name: Zip dist
        shell: pwsh
        run: Compress-Archive -Path dist\EditorialSystem -DestinationPath dist\EditorialSystem-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EditorialSystem-windows
          path: dist/EditorialSystem-windows.zip

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/EditorialSystem-windows.zip
